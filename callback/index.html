<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="POIresearch 的微博开放平台授权回调页。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>授权回调｜POIresearch</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/styles.css">
  <script src="../assets/callback.js" defer></script>
</head>
<body>
  <main class="callback-page">
    <section class="callback-card">
      <div class="callback-icon" id="callback-icon" aria-hidden="true">…</div>
      <span class="kicker">OAUTH CALLBACK</span>
      <h1 id="callback-title">正在读取授权结果</h1>
      <p id="callback-message">请稍候，本页面只在本机浏览器中检查微博开放平台返回的授权状态。</p>
      <div class="callback-result" id="callback-result" hidden>
        <strong>授权码</strong>
        <code id="callback-code"></code>
      </div>
      <div class="callback-actions">
        <button class="button primary" id="copy-button" type="button" hidden>复制授权码</button>
        <a class="button secondary" href="../index.html">返回项目首页</a>
      </div>
      <p class="callback-note" id="callback-status">授权码属于敏感凭证，请勿转发、发布或保存在公开网页中。</p>
    </section>
  </main>
</body>
</html>
